name: harbor-image

# Replace the on-server `/root/bin/build` pipeline. Every push to
# `main` triggers a fresh `linux/amd64` build of the m9m Docker image
# and pushes it to Harbor under the `latest` tag. The remote box no
# longer runs `bin/build`; instead its `/root/gabungan/docker-compose.yaml`
# pulls the same image via `docker compose pull m9m-backend &&
# docker compose up -d`.
#
# Why single-arch + single tag: the production deploy target
# (`187.77.113.218`) is amd64 and the server references
# `harbor.solutiontech.id/m9m/m9m-core:latest`. Dropping arm64 removes
# the qemu-emulated cross-build (~20 min saved) and trimming extra
# tags keeps the registry catalog minimal — every push simply
# overwrites :latest.
#
# Triggers:
#   * push to `main`
#   * manual dispatch (workflow_dispatch) for emergency rebuilds
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   REGISTRY_USERNAME   — Harbor robot or personal account, e.g. `m9m`
#   REGISTRY_PASSWORD   — matching password for that account
#   SSH_HOST            — m9m-server host, e.g. `187.77.113.218`
#   SSH_PORT            — SSH port, `2212` (port 22 is firewalled on the
#                         deploy box; only 2212 is open)
#   SSH_USER            — SSH user, `mhr` (operator account; was `root`
#                         before the move to `/home/mhr/` on 2026-09-11)
#   SSH_PRIVATE_KEY     — Private half of an SSH key whose public
#                         counterpart is in
#                         `~/.ssh/authorized_keys` on the server.
#                         Currently the operator's existing id_rsa.
#
# Two jobs chained by `needs:`:
#   1. build-and-push — produce the :latest image in Harbor
#   2. deploy          — SSH to the production server and run
#                        `/root/bin/pull-compose.sh` to pull :latest
#                        and restart the m9m-backend service.
#
# The deploy job is gated on the build succeeding. If the build fails
# or the registry push is rejected, the server is left untouched.
#
# The SSH key is the operator's existing key (id_rsa, no passphrase);
# the matching public half is already in the server's
# ~/.ssh/authorized_keys so no server-side change is required.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_HOST: harbor.solutiontech.id
  IMAGE_NAME: m9m-core

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push to Harbor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute build date
        id: build_date
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push image (linux/amd64, tag = latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_HOST }}/m9m/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=m9m-core
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build_date.outputs.build_date }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out of Harbor
        if: always()
        run: |
          # docker/login-action stores credentials at
          # ~/.docker/config.json. Revoke them at the end of the job so
          # a leaked runner image doesn't carry the Harbor token.
          docker logout "${{ env.REGISTRY_HOST }}" || true

  deploy:
    name: Deploy via SSH to m9m-server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skip auto-deploy when triggered by another workflow or when the
    # commit message says so. Useful when merging a doc-only commit.
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[no-deploy]')
    steps:
      - name: Trigger /root/bin/pull-compose.sh on ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Pin the server's host key so a MITM can't silently
          # redirect the SSH session. The line below is the
          # ED25519 entry from `~/.ssh/known_hosts` for port 2212.
          known_hosts: |
            [187.77.113.218]:2212 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHyaqc/JgysEX4KYD1dhDZ0VwFhiZJ/sGQvJaAckfZM4
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "=== deploy triggered by ${{ github.repository }}@${{ github.sha }} ==="
            bash /home/mhr/bin/pull-compose.sh
            echo "=== deploy complete ==="
