; supervisord runs both m9m and the n8n sync bridge inside the same container.
; m9m serves on :8080, the sync bridge on :8001.
; Anything that needs the sync API hits http://localhost:8001 from inside,
; or the docker-published host port from outside.

[supervisord]
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/app/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
user=root

; ---------- m9m execution engine ----------
[program:m9m]
command=/usr/local/bin/m9m serve --dev --workers 4 --mysql m9m_admin:Secure_Db_Pass_2026@tcp(mysql-db:3306)/m9m_prod?parseTime=true&charset=utf8mb4&loc=UTC
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/m9m.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/m9m.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=
    PATH="/usr/local/bin:/usr/bin:/bin",
    HOME="/app",
    M9M_DB_TYPE="mysql",
    M9M_MYSQL_DSN="m9m_admin:Secure_Db_Pass_2026@tcp(mysql-db:3306)/m9m_prod?parseTime=true&charset=utf8mb4&loc=UTC",
    WEBHOOK_URL="http://0.0.0.0:8080",
    WEBHOOK_SECRET="change-me-in-production"

; ---------- n8n <-> m9m sync bridge (FastAPI/uvicorn) ----------
[program:sync]
command=/usr/local/bin/python3 -m uvicorn sync:app --host 0.0.0.0 --port 8001 --app-dir /app/sync-service
directory=/app/sync-service
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/sync.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/sync.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=
    PATH="/usr/local/bin:/usr/bin:/bin",
    HOME="/app",
    N8N_BASE_URL="http://n8n-designer-frontend:5678",
    ; N8N_API_KEY is injected by docker-compose from .env; default empty.
    N8N_API_KEY="%(ENV_N8N_API_KEY)s",
    ; sync talks to m9m on localhost because both processes share this container.
    M9M_BASE_URL="http://localhost:8080",
    POLL_INTERVAL_SECONDS="30",
    SYNC_ONLY_ACTIVE="true",
    SYNC_PORT="8001"

[unix_http_server]
file=/app/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///app/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
